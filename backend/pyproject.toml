[project]
name = "salesbench-backend"
version = "0.1.0"
description = "SalesBench platform bootstrap; process health only"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
