[project]
name = "salesbench-backend"
version = "0.2.0"
description = "SalesBench persistent Market service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1", "uvicorn==0.53.0", "salesbench-engine==0.2.1",
    "sqlalchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.uv.sources]
salesbench-engine = { path = "../engine", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
