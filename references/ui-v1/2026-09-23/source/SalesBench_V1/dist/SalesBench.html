        else response={s1:'这款杯子是陶瓷内胆，杯盖可拆洗，建议手洗。它不是保温杯，也不建议倒置携带。380mL 和 500mL 可以按你的习惯选择。',s2:'基础款续航约 20 小时，长续航款约 40 小时。两款均支持蓝牙连接、折叠收纳，不含主动降噪。可以先看详情再决定。',s3:'标准款可放 13 英寸电脑，加大款可放 15 英寸电脑；都是开放式袋口，没有拉链。商品卡片中可以查看尺寸和价格。'}[m.id];
        channel.push({id:`msg-${++sequence}`,authorName:m.name,role:'merchant',text:response,time,preset:true});
        b.merchantId=m.id;b.page=input.type==='send_public'?'public':'private';b.focusedProductId=null;
        result={messageId:sent.id,merchantId:m.id,channel:input.type==='send_public'?'public':'private',replyMode:'preset'};
      } else if(input.type==='purchase') {
        const product=products.find(x=>x.id===p.productId);if(!product)return fail('PRODUCT_NOT_FOUND','商品不存在。');
        if(!Number.isInteger(p.quantity)||p.quantity<1||p.quantity>99)return fail('INVALID_QUANTITY','数量必须是 1–99 的整数。');
        if(p.expectedUnitPriceCents!==product.priceCents)return fail('PRICE_CHANGED','价格确认不匹配，请重新查看商品价格。');
        if(p.quantity>product.stock)return fail('OUT_OF_STOCK','剩余库存不足，请调整数量。');
        const total=product.priceCents*p.quantity;
        if(total>b.balanceCents)return fail('INSUFFICIENT_BALANCE','模拟余额不足，可以继续浏览其他商品。');
        const m=findMerchant(product.merchantId);
        const order={id:`SB-${String(++sequence).padStart(5,'0')}`,productId:product.id,productName:product.name,variant:product.variant,merchantId:m.id,merchantName:m.name,unitPriceCents:product.priceCents,quantity:p.quantity,totalCents:total,time:clock(),status:'模拟购买完成'};
        b.balanceCents-=total;product.stock-=p.quantity;m.revenueCents+=total;m.sold+=p.quantity;b.orders.unshift(order);b.focusedProductId=null;b.lastDecision={type:'purchase',productId:product.id,time:order.time};
        result={order:clone(order),balanceCents:b.balanceCents,remainingStock:product.stock};
      }
      revision++;
      const receipt={ok:true,schemaVersion:'1.0',actionId:input.id,actorId:b.id,type:input.type,revision,replayed:false,result};
      receipts.set(key,{fingerprint,receipt:clone(receipt)});
      for(const listener of listeners)try{listener();}catch{/* presentation errors do not roll back completed actions */}
      return clone(receipt);
    }
    return Object.freeze({observe,execute,subscribe(listener){listeners.add(listener);return()=>listeners.delete(listener);}});
  }
  return Object.freeze({bindBuyer});
}

  function checkout(id){const p=product(id);if(!p)return;dialogState={type:'checkout',productId:id,actionId:`purchase-${Date.now()}-${++counter}`,unitPrice:p.priceCents};doAction('view_product',{productId:id});const m=merchant(p.merchantId);modal('确认模拟购买',`<div class="modal-body"><div class="checkout-product"><img src="${p.image}" alt="${p.name}"><div><h3>${p.name}</h3><p>${m.name} · ${p.variant}</p></div></div><div class="summary-row"><span>单价</span><strong>¥${amount(p.priceCents)}</strong></div><div class="summary-row"><label for="quantity">购买数量 <span class="tiny">（库存 ${p.stock} 件）</span></label><input class="quantity-input" id="quantity" type="number" min="1" max="${Math.min(p.stock,99)}" value="1" step="1"></div><div class="summary-row total"><span>模拟支付</span><strong id="checkout-total">¥${amount(p.priceCents)}</strong></div><div class="summary-row"><span>购买后余额</span><strong id="checkout-balance">¥${amount(current.actor.balanceCents-p.priceCents)}</strong></div><div id="checkout-error" class="field-error" role="alert"></div><p class="dialog-small-note">本次操作只扣减模拟余额，并更新库存及购买历史，不涉及真实付款。</p></div>`,button('暂不购买','decline',`data-product="${id}"`,'text-btn')+button('返回详情','detail',`data-product="${id}"`)+button('确认购买','confirm','','btn primary'));const validate=()=>{const q=Number($('quantity').value);const valid=Number.isInteger(q)&&q>0&&q<=99;const total=valid?p.priceCents*q:0;$('checkout-total').textContent=valid?'¥'+amount(total):'—';$('checkout-balance').textContent=valid?'¥'+amount(current.actor.balanceCents-total):'—';const error=!valid?'请输入 1–99 的整数数量。':q>p.stock?'剩余库存不足，请调整数量。':total>current.actor.balanceCents?'模拟余额不足，可以继续浏览其他商品。':'';$('checkout-error').textContent=error;$('modal').querySelector('[data-action="confirm"]').disabled=!!error;};$('quantity').addEventListener('input',validate);validate();}
  function purchased(receipt){clearTimeout(toastTimer);$('toast').classList.remove('show');dialogState={type:'success'};const o=receipt.result.order;modal('购买完成',`<div class="success-body"><div class="success-check">${icon('check')}</div><h2>已完成模拟购买</h2><p>${escape(o.merchantName)} · ${escape(o.productName)} × ${o.quantity}</p><div class="success-amount">¥${amount(o.totalCents)}</div><p>当前余额 ¥${amount(receipt.result.balanceCents)}<br>购买记录已保存至「我的」</p></div>`,button('继续浏览','browse','data-page="products"')+button('查看购买历史','browse','data-page="me"','btn primary'));}
  function showConfig(){dialogState={type:'config'};const names={ranking:'排行榜',recommendation:'推荐顺序',publicFields:'公开信息',privateFields:'私人信息',replies:'交流与商家回复',session:'会话状态',purchase:'模拟购买'};modal('演示配置说明',`<div class="modal-body"><span class="demo-badge">暂定、可修改 · 非正式实验算法</span><dl class="config-list">${Object.entries(names).map(([key,label])=>`<div><dt>${label}</dt><dd>${escape(current.demoConfig[key])}</dd></div>`).join('')}</dl><p class="dialog-small-note">此版只验证买方操作流程；未接入实验核心、模型或真实支付。</p></div>`,button('知道了','close','','btn primary'));}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;switch(a){case'browse':go(el.dataset.page,el.dataset.merchant);break;case'detail':openDetail(el.dataset.product);break;case'checkout':checkout(el.dataset.product);break;case'config':showConfig();break;case'close':closeModal();break;case'decline':{const r=doAction('decline_purchase',{productId:el.dataset.product});closeModal(false);toast(r.ok?'已选择暂不购买，余额不变。':r.error.message);break;}case'confirm':{if(!dialogState||dialogState.type!=='checkout')break;el.disabled=true;const state=dialogState;const r=buyer.execute({id:state.actionId,type:'purchase',payload:{productId:state.productId,quantity:Number($('quantity').value),expectedUnitPriceCents:state.unitPrice}});if(r.ok)purchased(r);else{$('checkout-error').textContent=r.error.message;el.disabled=false;}break;}}});
  document.addEventListener('submit',e=>{if(e.target.id!=='message-form')return;e.preventDefault();const key=`${current.view}:${current.merchantId}`;const text=$('message-input').value;const r=doAction(current.view==='public'?'send_public':'send_private',{merchantId:current.merchantId,text});if(r.ok){draft[key]='';render();$('message-input').focus();}else toast(r.error.message);});
  $('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
  $('modal').addEventListener('click',e=>{if(e.target===$('modal')){const box=$('modal').getBoundingClientRect();if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)closeModal();}});
  buyer.subscribe(render);
  // Public Agent surface is scoped to exactly this buyer. It cannot export the market or rebind identity.
  const agentAPI=Object.freeze({observe(query={}){return buyer.observe(query);},execute(action){const r=buyer.execute(action);if(r.ok){if(action.type==='view_product'){const p=action.payload.productId;openDetail(p,false);}else if(action.type==='purchase')purchased(r);else closeModal(false);}return r;}});
  Object.defineProperty(window,'salesbench',{value:agentAPI,writable:false,configurable:false});
  if(document.modelContext?.registerTool){for(const tool of [{name:'salesbench_observe',title:'观察当前买方页面',description:'只读取当前买家有权观察的页面数据；不返回其他买家信息或商家内部数据。',inputSchema:{type:'object',properties:{view:{type:'string',enum:['leaderboard','products','public','private','me','product']},merchantId:{type:'string'},productId:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true},execute:q=>agentAPI.observe(q)},{name:'salesbench_execute_action',title:'执行模拟买方动作',description:'执行买方 JSON 动作并返回回执。purchase 会立即扣减模拟余额、减少库存、创建购买记录；无真实付款。',inputSchema:{type:'object',properties:{id:{type:'string'},type:{type:'string',enum:['browse','view_product','close_detail','send_public','send_private','purchase','decline_purchase']},payload:{type:'object'}},required:['id','type','payload'],additionalProperties:false},annotations:{readOnlyHint:false},execute:a=>agentAPI.execute(a)}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{});}catch{}}}
  render();
})();
</script></body>
